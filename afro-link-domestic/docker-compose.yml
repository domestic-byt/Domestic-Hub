services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: afrolink
      POSTGRES_PASSWORD: afrolink
      POSTGRES_DB: afrolink
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afrolink -d afrolink']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://afrolink:afrolink@db:5432/afrolink
      PORT: '3000'
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
